name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "大淘客加密商品ID解密工具" --collect-all openpyxl --hidden-import openpyxl taoke_decoder.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 大淘客加密商品ID解密工具-windows
          path: dist/*.exe
